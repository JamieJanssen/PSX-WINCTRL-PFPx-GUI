name: Apply v1.57 update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Prepare v1.57 update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          p = Path('psx_winctrl_pfp.py')
          text = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise RuntimeError(f'Could not find {label}')
              text = text.replace(old, new, 1)

          replace_once('import re\n', 'import re\nimport shutil\n', 'shutil import')
          replace_once('VERSION = "1.56h"', 'VERSION = "1.57"', 'version')

          replace_once(
          '''SHUTDOWN_REQUESTED = threading.Event()\n''',
          '''SHUTDOWN_REQUESTED = threading.Event()\nBRIDGE_RESTART_REQUESTED = threading.Event()\n''',
          'bridge restart event')

          replace_once(
          '''SCRIPT_DIR = get_app_dir()\nCONFIG_FILE = os.path.join(SCRIPT_DIR, "psx_winctrl_pfp.ini")\n''',
          '''SCRIPT_DIR = get_app_dir()\nLEGACY_CONFIG_FILE = os.path.join(SCRIPT_DIR, "psx_winctrl_pfp.ini")\n\nif sys.platform == "darwin":\n    CONFIG_DIR = os.path.expanduser(\n        "~/Library/Application Support/PSX WINCTRL PFPx"\n    )\n    os.makedirs(CONFIG_DIR, exist_ok=True)\n    CONFIG_FILE = os.path.join(CONFIG_DIR, "psx_winctrl_pfp.ini")\n\n    # Migrate an existing editable INI from the old app/executable folder once.\n    # copy2 preserves the file verbatim, including all comments and formatting.\n    if not os.path.exists(CONFIG_FILE) and os.path.exists(LEGACY_CONFIG_FILE):\n        try:\n            shutil.copy2(LEGACY_CONFIG_FILE, CONFIG_FILE)\n        except OSError:\n            pass\nelse:\n    CONFIG_FILE = LEGACY_CONFIG_FILE\n''',
          'macOS config path')

          replace_once(
          '''PFP_DEVICE_LABEL = PFP_DEVICE_LABELS[PFP_PRODUCT_ID]\n\n\ndef pfp_device_label(pid):\n''',
          '''PFP_DEVICE_LABEL = PFP_DEVICE_LABELS[PFP_PRODUCT_ID]\n\nDEVICE_CHOICES = (\n    ("PFP3N Captain", 0xBB35, "31BB"),\n    ("PFP3N Observer", 0xBB39, "31BB"),\n    ("PFP3N First Officer", 0xBB3D, "31BB"),\n    ("MCDU Captain", 0xBB36, "32BB"),\n    ("MCDU Observer", 0xBB3A, "32BB"),\n    ("MCDU First Officer", 0xBB3E, "32BB"),\n    ("PFP7 Captain", 0xBB37, "33BB"),\n    ("PFP7 Observer", 0xBB3B, "33BB"),\n    ("PFP7 First Officer", 0xBB3F, "33BB"),\n    ("PFP4 Captain", 0xBB38, "34BB"),\n    ("PFP4 Observer", 0xBB3C, "34BB"),\n    ("PFP4 First Officer", 0xBB40, "34BB"),\n)\nDEVICE_CHOICE_BY_PID = {pid: (label, pid, did) for label, pid, did in DEVICE_CHOICES}\n\n\ndef pfp_device_label(pid):\n''',
          'device choices')

          replace_once(
          '''        self.menu_open = False\n        self.about_open = False\n        self.button_bounds = {}\n''',
          '''        self.menu_open = False\n        self.about_open = False\n        self.settings_open = False\n        self.device_dropdown_open = False\n        self.settings_panel_bounds = None\n        self.device_field_bounds = None\n        self.device_option_bounds = []\n        self.button_bounds = {}\n''',
          'settings state')

          replace_once(
          '''    def _toggle_mini_mode(self):\n        self.menu_open = False\n        self.about_open = False\n        self.root.update_idletasks()\n''',
          '''    def _toggle_mini_mode(self):\n        self.menu_open = False\n        self.about_open = False\n        self.settings_open = False\n        self.device_dropdown_open = False\n        self.root.update_idletasks()\n''',
          'mini settings reset')

          anchor = '''    def _show_about(self):\n        self.menu_open = False\n        self.about_open = True\n        if self.psx_sender is not None:\n            self.psx_sender.show_about_overlay()\n        self._draw()\n\n    def _close_about(self):\n'''
          replacement = '''    def _show_about(self):\n        self.menu_open = False\n        self.settings_open = False\n        self.device_dropdown_open = False\n        self.about_open = True\n        if self.psx_sender is not None:\n            self.psx_sender.show_about_overlay()\n        self._draw()\n\n    def _configured_device_choice(self):\n        cfg = configparser.ConfigParser()\n        try:\n            cfg.read(CONFIG_FILE, encoding="utf-8")\n            pid = int(cfg.get("FMC", "PID", fallback=f"{PFP_PRODUCT_ID:04X}"), 16)\n        except (ValueError, configparser.Error, OSError):\n            pid = PFP_PRODUCT_ID\n        return DEVICE_CHOICE_BY_PID.get(pid, (pfp_device_label(pid), pid, f"{PFP_DEST[0]:02X}{PFP_DEST[1]:02X}"))\n\n    def _show_settings(self):\n        self.menu_open = False\n        self.about_open = False\n        self.settings_open = True\n        self.device_dropdown_open = False\n        self._draw()\n\n    def _close_settings(self):\n        self.settings_open = False\n        self.device_dropdown_open = False\n        self._draw()\n\n    def _start_bridge_thread(self):\n        if self.stopping or SHUTDOWN_REQUESTED.is_set():\n            return\n        if self.bridge_thread is not None and self.bridge_thread.is_alive():\n            return\n        bridge_thread = threading.Thread(target=bridge_main, name="PSX Bridge")\n        self.set_bridge_thread(bridge_thread)\n        bridge_thread.start()\n\n    def _restart_bridge_when_stopped(self):\n        if self.stopping or SHUTDOWN_REQUESTED.is_set():\n            return\n        if self.bridge_thread is not None and self.bridge_thread.is_alive():\n            self.root.after(100, self._restart_bridge_when_stopped)\n            return\n        BRIDGE_RESTART_REQUESTED.clear()\n        self.set_psx_sender(None)\n        self._start_bridge_thread()\n\n    def _select_device(self, choice):\n        global PFP_PRODUCT_ID, PFP_DEST, PFP_DEVICE_LABEL\n\n        label, pid, did = choice\n        save_ini_value("FMC", "PID", f"{pid:04X}")\n        save_ini_value("FMC", "DID", did)\n\n        PFP_PRODUCT_ID = pid\n        PFP_DEST = bytes([int(did[0:2], 16), int(did[2:4], 16)])\n        PFP_DEVICE_LABEL = pfp_device_label(pid)\n        self.root.title(self._display_title())\n        log(f"[CONFIG] Device set to {label} (PID={pid:04X} DID={did})")\n\n        self.device_dropdown_open = False\n        self.settings_open = False\n        BRIDGE_RESTART_REQUESTED.set()\n\n        if self.bridge_thread is not None and self.bridge_thread.is_alive():\n            log("[HID] switching device...")\n            self.root.after(100, self._restart_bridge_when_stopped)\n        else:\n            BRIDGE_RESTART_REQUESTED.clear()\n            self._start_bridge_thread()\n        self._draw()\n\n    def _close_about(self):\n'''
          replace_once(anchor, replacement, 'settings methods')

          replace_once(
          '''        if self.about_open:\n            self._close_about()\n            return\n\n        if not self.mini_mode and self.menu_button_bounds:\n''',
          '''        if self.about_open:\n            self._close_about()\n            return\n\n        if self.settings_open:\n            if self.device_dropdown_open:\n                for choice, bounds in self.device_option_bounds:\n                    x1, y1, x2, y2 = bounds\n                    if x1 <= event.x <= x2 and y1 <= event.y <= y2:\n                        self._select_device(choice)\n                        return\n\n            if self.device_field_bounds:\n                x1, y1, x2, y2 = self.device_field_bounds\n                if x1 <= event.x <= x2 and y1 <= event.y <= y2:\n                    self.device_dropdown_open = not self.device_dropdown_open\n                    self._draw()\n                    return\n\n            if self.settings_panel_bounds:\n                x1, y1, x2, y2 = self.settings_panel_bounds\n                if x1 <= event.x <= x2 and y1 <= event.y <= y2:\n                    return\n\n            self._close_settings()\n            return\n\n        if not self.mini_mode and self.menu_button_bounds:\n''',
          'settings click handling')

          replace_once(
          '''                    if item == 0:\n                        self._copy_log_to_clipboard()\n                    elif item == 1:\n                        self._toggle_debug()\n                    else:\n                        self._show_about()\n''',
          '''                    if item == 0:\n                        self._copy_log_to_clipboard()\n                    elif item == 1:\n                        self._toggle_debug()\n                    elif item == 2:\n                        self._show_settings()\n                    else:\n                        self._show_about()\n''',
          'menu click settings')

          replace_once(
          '''        y2 = y1 + 90\n''',
          '''        y2 = y1 + 120\n''',
          'menu height')
          replace_once(
          '''        items = (\n            "Copy log",\n            f"{check}Debug logging",\n            "About",\n        )\n''',
          '''        items = (\n            "Copy log",\n            f"{check}Debug logging",\n            "Settings",\n            "About",\n        )\n''',
          'menu settings item')

          insert_before_about = '''    def _draw_about(self, width, height):\n'''
          settings_draw = '''    def _draw_settings(self, width, height):\n        self.settings_panel_bounds = None\n        self.device_field_bounds = None\n        self.device_option_bounds = []\n\n        if self.mini_mode or not self.settings_open:\n            return\n\n        x1 = 52\n        y1 = 55\n        x2 = width - 52\n        y2 = height - 30\n        self.canvas.create_rectangle(\n            x1, y1, x2, y2,\n            fill=self.PANEL_BG,\n            outline=self.BORDER_FG,\n            width=1,\n        )\n        self.settings_panel_bounds = (x1, y1, x2, y2)\n\n        self.canvas.create_text(\n            (x1 + x2) / 2, y1 + 24,\n            text="Settings", anchor="center",\n            fill=self.TEXT_FG, font=("Helvetica", 14, "bold"),\n        )\n        self.canvas.create_text(\n            x1 + 18, y1 + 57,\n            text="Device", anchor="w",\n            fill=self.TEXT_FG, font=("Helvetica", 11, "bold"),\n        )\n\n        field_x1 = x1 + 88\n        field_y1 = y1 + 42\n        field_x2 = x2 - 18\n        field_y2 = field_y1 + 28\n        current_label = self._configured_device_choice()[0]\n        self.canvas.create_rectangle(\n            field_x1, field_y1, field_x2, field_y2,\n            fill="#FFFFFF", outline=self.BORDER_FG, width=1,\n        )\n        self.canvas.create_text(\n            field_x1 + 9, (field_y1 + field_y2) / 2,\n            text=current_label, anchor="w",\n            fill=self.TEXT_FG, font=("Helvetica", 10),\n        )\n        self.canvas.create_text(\n            field_x2 - 10, (field_y1 + field_y2) / 2,\n            text="▼", anchor="center",\n            fill=self.MUTED_FG, font=("Helvetica", 9),\n        )\n        self.device_field_bounds = (field_x1, field_y1, field_x2, field_y2)\n\n        if self.device_dropdown_open:\n            row_h = 17\n            list_y1 = field_y2\n            list_y2 = list_y1 + row_h * len(DEVICE_CHOICES)\n            self.canvas.create_rectangle(\n                field_x1, list_y1, field_x2, list_y2,\n                fill="#FFFFFF", outline=self.BORDER_FG, width=1,\n            )\n            for index, choice in enumerate(DEVICE_CHOICES):\n                row_y1 = list_y1 + index * row_h\n                row_y2 = row_y1 + row_h\n                if choice[0] == current_label:\n                    self.canvas.create_rectangle(\n                        field_x1 + 1, row_y1, field_x2 - 1, row_y2,\n                        fill="#E3D8C9", outline="",\n                    )\n                self.canvas.create_text(\n                    field_x1 + 9, (row_y1 + row_y2) / 2,\n                    text=choice[0], anchor="w",\n                    fill=self.TEXT_FG, font=("Helvetica", 9),\n                )\n                self.device_option_bounds.append(\n                    (choice, (field_x1, row_y1, field_x2, row_y2))\n                )\n        else:\n            self.canvas.create_text(\n                (x1 + x2) / 2, y2 - 18,\n                text="Click outside to close", anchor="center",\n                fill=self.MUTED_FG, font=("Helvetica", 10),\n            )\n\n'''
          replace_once(insert_before_about, settings_draw + insert_before_about, 'settings drawing')

          replace_once(
          '''        self._draw_menu(right)\n        self._draw_about(width, height)\n''',
          '''        self._draw_menu(right)\n        self._draw_settings(width, height)\n        self._draw_about(width, height)\n''',
          'draw settings overlay')

          replace_once(
          '''        while not SHUTDOWN_REQUESTED.is_set():\n''',
          '''        while (\n            not SHUTDOWN_REQUESTED.is_set()\n            and not BRIDGE_RESTART_REQUESTED.is_set()\n        ):\n''',
          'bridge restart loop condition')

          replace_once(
          '''        log("[END] Please restart" if hid_disconnected else "[END]")\n''',
          '''        global BRIDGE_PSX\n        BRIDGE_PSX = None\n        if GUI_APP is not None:\n            GUI_APP.set_psx_sender(None)\n\n        if BRIDGE_RESTART_REQUESTED.is_set() and not SHUTDOWN_REQUESTED.is_set():\n            log_debug("[HID] device switch cleanup complete")\n        else:\n            log("[END] Please restart" if hid_disconnected else "[END]")\n''',
          'bridge restart cleanup')

          replace_once(
          '''def main():\n    global GUI_APP\n\n    GUI_APP = BridgeGui()\n    bridge_thread = threading.Thread(target=bridge_main, name="PSX Bridge")\n    GUI_APP.set_bridge_thread(bridge_thread)\n    GUI_APP.root.after(100, bridge_thread.start)\n    GUI_APP.run()\n''',
          '''def main():\n    global GUI_APP\n\n    GUI_APP = BridgeGui()\n    GUI_APP.root.after(100, GUI_APP._start_bridge_thread)\n    GUI_APP.run()\n''',
          'main bridge starter')

          ast.parse(text)
          p.write_text(text, encoding='utf-8')
          PY
          python -m py_compile psx_winctrl_pfp.py

      - name: Commit v1.57
        shell: bash
        run: |
          git config user.name "JamieJanssen"
          git config user.email "jamie@itsjamie.com"
          git add psx_winctrl_pfp.py
          git commit -m "v1.57 add device settings and macOS config location"
          git push origin HEAD:main
